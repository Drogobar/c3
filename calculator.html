<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <style>
        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --calculator-bg: #ffffff;
            --display-bg: #1a1a1a;
            --display-text: #ffffff;
            --button-bg: #f0f0f0;
            --button-hover: #e0e0e0;
            --button-text: #333;
            --operator-bg: #667eea;
            --operator-hover: #5568d3;
            --equals-bg: #764ba2;
            --equals-hover: #653a8a;
            --clear-bg: #ff6b6b;
            --clear-hover: #ee5a5a;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.2);
            --history-bg: #ffffff;
            --history-text: #333;
            --history-item-bg: #f5f5f5;
            --history-item-hover: #e8e8e8;
        }

        body.dark-theme {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --calculator-bg: #0f3460;
            --display-bg: #16213e;
            --display-text: #e94560;
            --button-bg: #1a1a2e;
            --button-hover: #2a2a3e;
            --button-text: #ffffff;
            --operator-bg: #e94560;
            --operator-hover: #d83550;
            --equals-bg: #e94560;
            --equals-hover: #d83550;
            --clear-bg: #ff6b6b;
            --clear-hover: #ee5a5a;
            --shadow: rgba(0, 0, 0, 0.5);
            --shadow-hover: rgba(233, 69, 96, 0.3);
            --history-bg: #0f3460;
            --history-text: #ffffff;
            --history-item-bg: #1a1a2e;
            --history-item-hover: #2a2a3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            padding: 20px;
            transition: background 0.3s ease;
        }

        .credit {
            font-size: 0.75rem;
            font-style: italic;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            text-align: center;
            transition: color 0.3s ease;
        }

        body.dark-theme .credit {
            color: rgba(255, 255, 255, 0.5);
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
        }

        .calculator {
            background: var(--calculator-bg);
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--shadow);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--button-bg);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            color: var(--button-text);
            box-shadow: 0 2px 8px var(--shadow-hover);
        }

        .theme-toggle:hover {
            background: var(--button-hover);
            transform: scale(1.1);
        }

        .display {
            background: var(--display-bg);
            color: var(--display-text);
            font-size: 2.5rem;
            padding: 20px;
            text-align: right;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-wrap: break-word;
            overflow-wrap: break-word;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            background: var(--button-bg);
            border: none;
            border-radius: 10px;
            font-size: 1.5rem;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            color: var(--button-text);
        }

        button:hover {
            background: var(--button-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--shadow-hover);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px var(--shadow-hover);
        }

        .operator {
            background: var(--operator-bg);
            color: #ffffff;
        }

        .operator:hover {
            background: var(--operator-hover);
        }

        .equals {
            background: var(--equals-bg);
            color: #ffffff;
        }

        .equals:hover {
            background: var(--equals-hover);
        }

        .clear {
            background: var(--clear-bg);
            color: #ffffff;
        }

        .clear:hover {
            background: var(--clear-hover);
        }

        .zero {
            grid-column: span 2;
        }

        .history {
            background: var(--history-bg);
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--shadow);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            max-height: 600px;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--button-bg);
        }

        .history-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--button-text);
        }

        .clear-history-btn {
            background: var(--clear-bg);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .clear-history-btn:hover {
            background: var(--clear-hover);
            transform: translateY(-1px);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .history-list::-webkit-scrollbar {
            width: 8px;
        }

        .history-list::-webkit-scrollbar-track {
            background: var(--button-bg);
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: var(--operator-bg);
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb:hover {
            background: var(--operator-hover);
        }

        .history-item {
            background: var(--history-item-bg);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--history-text);
        }

        .history-item:hover {
            background: var(--history-item-hover);
            transform: translateX(5px);
        }

        .history-expression {
            font-size: 0.9rem;
            color: var(--history-text);
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .history-result {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--history-text);
        }

        .history-empty {
            text-align: center;
            color: var(--history-text);
            opacity: 0.5;
            padding: 40px 20px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="credit">Калькулятор разработан Максимом Жуковым с помощью Курсора</div>
    <div class="container">
        <div class="calculator">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Переключить тему">
                🌙
            </button>
            <div class="display" id="display">0</div>
            <div class="buttons">
                <button class="clear" onclick="clearDisplay()">C</button>
                <button class="operator" onclick="appendOperator('/')">/</button>
                <button class="operator" onclick="appendOperator('*')">×</button>
                <button class="operator" onclick="deleteLast()">⌫</button>
                
                <button onclick="appendNumber('7')">7</button>
                <button onclick="appendNumber('8')">8</button>
                <button onclick="appendNumber('9')">9</button>
                <button class="operator" onclick="appendOperator('-')">-</button>
                
                <button onclick="appendNumber('4')">4</button>
                <button onclick="appendNumber('5')">5</button>
                <button onclick="appendNumber('6')">6</button>
                <button class="operator" onclick="appendOperator('+')">+</button>
                
                <button onclick="appendNumber('1')">1</button>
                <button onclick="appendNumber('2')">2</button>
                <button onclick="appendNumber('3')">3</button>
                <button class="equals" onclick="calculate()" rowspan="2">=</button>
                
                <button class="zero" onclick="appendNumber('0')">0</button>
                <button onclick="appendDecimal()">.</button>
            </div>
        </div>

        <div class="history">
            <div class="history-header">
                <div class="history-title">Журнал операций</div>
                <button class="clear-history-btn" onclick="clearHistory()" title="Очистить журнал">Очистить</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">История операций пуста</div>
            </div>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let currentInput = '0';
        let shouldResetDisplay = false;
        let history = [];
        let expressionBeforeCalculate = '';

        // Функция переключения темы
        function toggleTheme() {
            const body = document.body;
            const themeToggle = document.getElementById('themeToggle');
            const isDark = body.classList.toggle('dark-theme');
            
            // Обновляем иконку
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            
            // Сохраняем выбор пользователя
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Загружаем сохраненную тему при загрузке страницы
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const themeToggle = document.getElementById('themeToggle');
            
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                themeToggle.textContent = '☀️';
            } else {
                document.body.classList.remove('dark-theme');
                themeToggle.textContent = '🌙';
            }
        }

        // Функция добавления операции в журнал
        function addToHistory(expression, result) {
            const historyItem = {
                expression: expression,
                result: result,
                timestamp: new Date()
            };
            
            history.unshift(historyItem);
            
            // Ограничиваем историю 50 записями
            if (history.length > 50) {
                history = history.slice(0, 50);
            }
            
            // Сохраняем в localStorage
            saveHistory();
            
            // Обновляем отображение
            renderHistory();
        }

        // Функция экранирования HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Функция отображения журнала
        function renderHistory() {
            const historyList = document.getElementById('historyList');
            
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">История операций пуста</div>';
                return;
            }
            
            historyList.innerHTML = history.map((item, index) => {
                const expression = escapeHtml(item.expression);
                const result = escapeHtml(item.result);
                return `
                    <div class="history-item" onclick="useHistoryResult(${index})">
                        <div class="history-expression">${expression} =</div>
                        <div class="history-result">${result}</div>
                    </div>
                `;
            }).join('');
        }

        // Функция использования результата из истории
        function useHistoryResult(index) {
            if (history[index]) {
                currentInput = history[index].result;
                shouldResetDisplay = false;
                updateDisplay();
            }
        }

        // Функция очистки журнала
        function clearHistory() {
            history = [];
            saveHistory();
            renderHistory();
        }

        // Сохранение журнала в localStorage
        function saveHistory() {
            localStorage.setItem('calculatorHistory', JSON.stringify(history));
        }

        // Загрузка журнала из localStorage
        function loadHistory() {
            const savedHistory = localStorage.getItem('calculatorHistory');
            if (savedHistory) {
                try {
                    history = JSON.parse(savedHistory);
                    // Преобразуем строки дат обратно в объекты Date
                    history = history.map(item => ({
                        ...item,
                        timestamp: new Date(item.timestamp)
                    }));
                    renderHistory();
                } catch (error) {
                    console.error('Ошибка загрузки истории:', error);
                    history = [];
                }
            }
        }

        // Загружаем тему и историю при загрузке страницы
        window.addEventListener('DOMContentLoaded', function() {
            loadTheme();
            loadHistory();
        });

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function appendNumber(number) {
            if (shouldResetDisplay) {
                currentInput = '0';
                shouldResetDisplay = false;
            }
            
            if (currentInput === '0') {
                currentInput = number;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (shouldResetDisplay) {
                currentInput = '0';
                shouldResetDisplay = false;
            }
            
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay();
            }
        }

        function appendOperator(operator) {
            if (shouldResetDisplay) {
                shouldResetDisplay = false;
            }
            
            const lastChar = currentInput[currentInput.length - 1];
            if (['+', '-', '*', '/'].includes(lastChar)) {
                currentInput = currentInput.slice(0, -1) + operator;
            } else {
                currentInput += operator;
            }
            updateDisplay();
        }

        function calculate() {
            try {
                // Сохраняем выражение до вычисления
                expressionBeforeCalculate = currentInput;
                
                // Заменяем × на * для вычисления
                let expression = currentInput.replace(/×/g, '*');
                
                // Проверяем на деление на ноль
                if (expression.includes('/0') && !expression.includes('/0.')) {
                    currentInput = 'Ошибка';
                    updateDisplay();
                    shouldResetDisplay = true;
                    return;
                }
                
                const result = Function('"use strict"; return (' + expression + ')')();
                
                if (isNaN(result) || !isFinite(result)) {
                    currentInput = 'Ошибка';
                } else {
                    // Добавляем операцию в журнал
                    addToHistory(expressionBeforeCalculate, result.toString());
                    currentInput = result.toString();
                }
                
                updateDisplay();
                shouldResetDisplay = true;
            } catch (error) {
                currentInput = 'Ошибка';
                updateDisplay();
                shouldResetDisplay = true;
            }
        }

        function clearDisplay() {
            currentInput = '0';
            shouldResetDisplay = false;
            updateDisplay();
        }

        function deleteLast() {
            if (shouldResetDisplay) {
                clearDisplay();
                return;
            }
            
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        // Поддержка клавиатуры
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9') {
                appendNumber(key);
            } else if (key === '.') {
                appendDecimal();
            } else if (key === '+') {
                appendOperator('+');
            } else if (key === '-') {
                appendOperator('-');
            } else if (key === '*') {
                appendOperator('*');
            } else if (key === '/') {
                event.preventDefault();
                appendOperator('/');
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Escape' || key === 'c' || key === 'C') {
                clearDisplay();
            } else if (key === 'Backspace') {
                deleteLast();
            }
        });
    </script>
</body>
</html>
